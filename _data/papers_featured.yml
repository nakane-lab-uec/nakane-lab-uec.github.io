- year: 2026
  authors: "Yoshioka A, Shimada YY, Omori T, Uemura NA, Takeshita K, Ishigami K, Morimura H, Furubayashi M, Kan T*, Wada H*, Kikuchi Y*, Nakane D*"
  title: "Bacteria break through one-micrometer-square passages by flagellar wrapping"
  journal: "Nature Communications 17: 713"
