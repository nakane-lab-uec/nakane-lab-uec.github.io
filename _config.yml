# ===== サイト全体の設定 =====
title: "中根研究室 Nakane Lab@UEC"
# トップページのタイトル（検索結果に表示されます）
home_title: "電気通信大学 中根研究室｜Nakane Lab, UEC Tokyo — 細菌の運動と光学顕微鏡"
description: "電気通信大学 基盤理工学専攻 中根大介の研究室。光学顕微鏡を工夫して、細菌がなぜ・どのように動くのかを研究しています。Nakane Lab at UEC, Tokyo studies how and why bacteria move, using optical microscopy and microfluidic devices."
# SNS などで共有されたときの画像（記事に写真がないときに使う）
default_image: /assets/img/people/ef46f92064430a15.jpg
# 中根の研究者プロフィール（検索エンジン向け）
pi_profiles:
  - https://orcid.org/0000-0002-8201-2608
  - https://researchmap.jp/daisuke.nakane
  - https://scholar.google.co.jp/citations?user=D7xiqz0AAAAJ
  - https://nrid.nii.ac.jp/ja/nrid/1000040708997/
# Google Search Console の「HTML タグ」で確認するときは、content="..." の中身をここに貼る
google_site_verification: "Y90EMEd19RJSffatbeJIJpggAGN4lZeJ22PyMtgLwh8"
email: "dice-k@uec.ac.jp"
tel: "042-443-5146"

# 独自ドメインを使う場合は url を書き換えてください（例: https://nakane-lab.jp）
url: "https://nakane-lab-uec.github.io"
baseurl: ""

lang: ja
timezone: Asia/Tokyo
future: true   # 日付が未来の記事もすぐ表示する
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true   # 改行をそのまま改行として表示

# お知らせ記事の URL: /news/<日付>-<ファイル名の最後の部分>/（例: /news/20261110-183000/）
permalink: /news/:year:month:day-:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: page }

# サイトマップ（sitemap.xml）を自動で作る
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - "更新マニュアル.md"
  - tools/
  - templates/
  - vendor/
  - Gemfile
  - Gemfile.lock
