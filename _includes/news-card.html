{% assign p = include.post %}
<a class="ncard reveal" href="{{ p.url | relative_url }}">
  <div class="th">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="" loading="lazy">{% else %}<svg viewBox="0 0 100 70" aria-hidden="true"><rect class="f" x="20" y="26" width="46" height="20" rx="10"/><rect class="s" x="20" y="26" width="46" height="20" rx="10"/><path class="s" d="M20 36 q-5 -6 -10 0"/><path class="s" d="M74 20 l6 -6 M78 30 h8 M74 40 l6 6"/></svg>{% endif %}</div>
  <div class="body"><time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%Y.%m.%d" }}</time><span class="t"><span lang="ja">{{ p.title }}</span><span lang="en">{{ p.title_en | default: p.title }}</span></span></div>
</a>
