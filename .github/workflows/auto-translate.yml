# 日本語で更新すると、英語を自動で付ける仕組みです。
#   ・お知らせ・論文解説・リンクなどで「英語の欄が空」の項目を探し、Claude API で英訳して書き込みます。
#   ・リポジトリの Settings → Secrets and variables → Actions に「ANTHROPIC_API_KEY」が必要です。
#     設定していない間は、何もせずに終わります（サイトには影響しません）。
#   ・くわしい説明は README.md の「英語の自動翻訳」にあります。
name: 英語の自動翻訳 (Auto-translate)

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "_data/**"
      - "research/index.html"
      - "access/index.html"
      - "papers/index.html"
  workflow_dispatch:      # Actions タブの「Run workflow」から手動でも実行できます

permissions:
  contents: write         # 翻訳した英語をリポジトリに書き込む
  pages: write            # 書き込んだあと、サイトを作り直してもらう

concurrency:
  group: auto-translate
  cancel-in-progress: false

env:
  # 翻訳に使う Claude のモデル。
  #   claude-sonnet-5-5 … お知らせ 1 件で数円程度
  #   claude-haiku-5-5  … 小型のモデル。費用はその約 20 分の 1
  # モデルが古くなって使えなくなったときは、同じ系列の新しいモデルを自動で探して使います。
  TRANSLATE_MODEL: claude-sonnet-5-5

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: サイトの中身を取り出す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: 準備
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml \
            || python3 -m pip install --quiet --user pyyaml

      - name: 英語が空の項目を翻訳する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/auto_translate.py

      - name: 翻訳を保存する
        id: save
        if: always()
        run: |
          if [ ! -d .git ] || [ -z "$(git status --porcelain)" ]; then
            echo "保存するものはありません。"
            echo "saved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "英語を自動で追加（自動翻訳）"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then
              echo "saved=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 翻訳している間に別の更新が入ったとき：その更新の上に載せ直す
            git pull --quiet --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
          done
          echo "::warning::翻訳を保存できませんでした（同時に別の更新があったため）。次の更新のときに、もう一度翻訳します。"
          echo "saved=false" >> "$GITHUB_OUTPUT"

      - name: サイトを作り直す
        # 自動で保存した分は、GitHub がサイトを作り直してくれないので、ここで頼みます
        if: always() && steps.save.outputs.saved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          if [ "$code" = "201" ]; then
            echo "サイトの作り直しを頼みました。1〜2 分で英語が表示されます。"
          else
            echo "::warning::サイトの作り直しを頼めませんでした (HTTP $code)。英語は、次にサイトを更新したときに表示されます。"
            cat /tmp/pages-build.json || true
          fi
