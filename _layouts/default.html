<!doctype html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
{% include seo.html %}
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<script>document.documentElement.dataset.lang="ja";try{var l=localStorage.getItem("lang");if(l)document.documentElement.dataset.lang=l;}catch(e){}</script>
</head>
<body class="{% if page.url == '/' %}home{% else %}sub{% endif %}">
{% include nav.html %}
<main id="top">
{{ content }}
</main>
{% include footer.html %}
<a class="totop" href="#top" aria-label="Back to top">↑</a>
<script>window.LAB_VIDEOS = {{ site.data.videos | jsonify }};</script>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
